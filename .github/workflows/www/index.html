<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#008069">
<title>Chat Efímero</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:#111b21;color:#e9edef;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* Pantalla de entrada */
#inicio{display:flex;flex-direction:column;gap:14px;padding:30px;margin:auto;width:100%;max-width:420px}
#inicio .logo{width:90px;height:90px;border-radius:50%;background:#00a884;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:44px}
#inicio h1{text-align:center;color:#e9edef;font-weight:500;font-size:24px}
#inicio p{text-align:center;font-size:13px;color:#8696a0;line-height:1.4}
#inicio input{background:#202c33;color:#e9edef;padding:15px;border-radius:10px;border:none;border-bottom:2px solid #00a884;font-size:16px;outline:none}
#inicio button{background:#00a884;color:#111b21;font-weight:600;padding:15px;border-radius:24px;border:none;font-size:16px;cursor:pointer}
#estado{min-height:18px}

/* Chat */
#chat{display:none;flex-direction:column;height:100vh;height:100dvh}
#barra{background:#202c33;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.4);z-index:2}
#barra .avatar{width:40px;height:40px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
#barra .info{flex:1;min-width:0}
#barra b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#barra span{font-size:12px;color:#8696a0}
#sonido{background:none;border:none;font-size:20px;cursor:pointer;color:#aebac1}

#mensajes{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:3px;background-color:#0b141a;background-image:radial-gradient(#13202a 1.5px,transparent 1.5px);background-size:22px 22px}
.aviso{align-self:center;background:#182229;color:#ffd279;font-size:12px;padding:6px 12px;border-radius:8px;text-align:center;margin:6px 20px;max-width:90%;line-height:1.4}
.sis{align-self:center;font-size:12px;color:#8696a0;background:#182229;padding:4px 12px;border-radius:8px;margin:4px 0}

.msg{position:relative;max-width:80%;padding:6px 9px 4px 9px;border-radius:8px;font-size:15px;line-height:1.35;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.3)}
.yo{align-self:flex-end;background:#005c4b;border-top-right-radius:0;margin-left:40px}
.yo::after{content:'';position:absolute;top:0;right:-7px;border:7px solid transparent;border-top-color:#005c4b;border-left-color:#005c4b}
.otro{align-self:flex-start;background:#202c33;border-top-left-radius:0;margin-right:40px}
.otro::after{content:'';position:absolute;top:0;left:-7px;border:7px solid transparent;border-top-color:#202c33;border-right-color:#202c33}
.msg .autor{font-size:12.5px;font-weight:600;margin-bottom:2px}
.msg .pie{float:right;margin:4px 0 0 10px;font-size:11px;color:#ffffff99;display:flex;align-items:center;gap:3px}
.msg .check{color:#53bdeb;font-size:13px;letter-spacing:-5px}
.msg .texto{display:inline}
.msg audio{width:220px;height:38px;display:block;margin:2px 0}

/* Barra de escribir */
#entrada{display:flex;gap:8px;padding:8px;background:#0b141a;align-items:flex-end}
#entrada input{flex:1;background:#202c33;color:#e9edef;border:none;border-radius:24px;padding:12px 16px;font-size:16px;outline:none;min-width:0}
#entrada button{width:48px;height:48px;border-radius:50%;background:#00a884;border:none;color:#111b21;font-size:20px;cursor:pointer;flex-shrink:0}
#entrada button.grabando{background:#e53935;color:#fff;animation:latir 1s infinite}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#grabandoBarra{display:none;flex:1;align-items:center;gap:10px;background:#202c33;border-radius:24px;padding:12px 16px;font-size:15px;color:#ff8a8a}
#grabandoBarra .punto{width:10px;height:10px;border-radius:50%;background:#e53935;animation:latir 1s infinite}
#grabandoBarra small{margin-left:auto;color:#8696a0;font-size:12px}
</style>
</head>
<body>

<div id="inicio">
<div class="logo">⏳</div>
<h1>Chat Efímero</h1>
<p>Aquí nada se guarda. Los mensajes se borran solos cada 10 minutos.</p>
<input id="nombre" placeholder="Tu nombre" maxlength="20">
<input id="sala" placeholder="Nombre de la sala" maxlength="30">
<input id="clave" type="password" placeholder="Clave de la sala" maxlength="30">
<button onclick="entrar()">Entrar</button>
<p id="estado"></p>
</div>

<div id="chat">
<div id="barra">
<div class="avatar">👥</div>
<div class="info"><b id="titulo"></b><span id="cuenta"></span></div>
<button id="sonido" onclick="alternarSonido()">🔔</button>
</div>
<div id="mensajes"></div>
<div id="entrada">
<input id="texto" placeholder="Escribe un mensaje" maxlength="500" autocomplete="off" oninput="cambiarBoton()" onkeydown="if(event.key==='Enter')enviar()">
<div id="grabandoBarra"><span class="punto"></span>Grabando... <small id="segundos">0:00</small></div>
<button id="botonAccion" onclick="accion()">🎤</button>
</div>
</div>

<script>
const MINUTOS_BORRADO = 10;
const MS_BORRADO = MINUTOS_BORRADO * 60 * 1000;
const MAX_SEG_AUDIO = 120;
let peer = null, conexiones = {}, mensajes = [], miNombre = '', salaId = '', miId = '';
let sonidoActivo = true, audioCtx = null;
let grabador = null, trozos = [], grabando = false, tiempoGrab = 0, reloj = null, flujo = null;
const colores = ['#53bdeb','#ffd279','#ff8a8a','#a8e6a1','#d7a8ff','#ffb27a','#7ae0d0'];

function colorDe(nombre) {
  let h = 0;
  for (let i = 0; i < nombre.length; i++) h = (h * 31 + nombre.charCodeAt(i)) >>> 0;
  return colores[h % colores.length];
}

/* Tono de mensaje nuevo */
function tono() {
  if (!sonidoActivo) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    [[880, 0], [1175, 0.12]].forEach(([f, t]) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.18);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + t);
      o.stop(audioCtx.currentTime + t + 0.2);
    });
    if (navigator.vibrate) navigator.vibrate(80);
  } catch (e) {}
}

function alternarSonido() {
  sonidoActivo = !sonidoActivo;
  document.getElementById('sonido').textContent = sonidoActivo ? '🔔' : '🔕';
}

function idSala(sala, clave) {
  return 'chatefimero-' + btoa(unescape(encodeURIComponent(sala.toLowerCase() + '|' + clave))).replace(/[^a-zA-Z0-9]/g, '').slice(0, 40);
}

function entrar() {
  miNombre = document.getElementById('nombre').value.trim();
  const sala = document.getElementById('sala').value.trim();
  const clave = document.getElementById('clave').value;
  if (!miNombre || !sala || !clave) { document.getElementById('estado').textContent = 'Llena todos los campos'; return; }
  document.getElementById('estado').textContent = 'Conectando...';
  salaId = idSala(sala, clave);
  document.getElementById('titulo').textContent = sala;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  iniciarComoAnfitrion();
}

function iniciarComoAnfitrion() {
  peer = new Peer(salaId);
  peer.on('open', id => {
    miId = id; mostrarChat();
    aviso('🔒 Los mensajes y audios se borran solos cada ' + MINUTOS_BORRADO + ' minutos y no se guardan en ningún lado.');
    sistema('Creaste la sala. Comparte el nombre y la clave.');
  });
  peer.on('connection', c => registrar(c));
  peer.on('error', e => {
    if (e.type === 'unavailable-id') {
      peer = new Peer();
      peer.on('open', id => { miId = id; unirseAlAnfitrion(); });
      peer.on('connection', c => registrar(c));
      peer.on('error', e2 => { document.getElementById('estado').textContent = 'Error: ' + e2.type; });
    } else document.getElementById('estado').textContent = 'Error: ' + e.type;
  });
}

function unirseAlAnfitrion() {
  const c = peer.connect(salaId, { reliable: true });
  c.on('open', () => {
    registrar(c); mostrarChat();
    aviso('🔒 Los mensajes y audios se borran solos cada ' + MINUTOS_BORRADO + ' minutos y no se guardan en ningún lado.');
    sistema('Te uniste a la sala');
  });
}

function registrar(c) {
  conexiones[c.peer] = c;
  const saludar = () => c.send({ tipo: 'hola', nombre: miNombre });
  if (c.open) saludar(); else c.on('open', saludar);
  c.on('data', d => recibir(d, c.peer));
  c.on('close', () => { delete conexiones[c.peer]; });
}

function reenviar(d, deQuien) {
  if (peer && peer.id === salaId) {
    Object.keys(conexiones).forEach(k => { if (k !== deQuien && conexiones[k].open) conexiones[k].send(d); });
  }
}

function recibir(d, deQuien) {
  if (d.tipo === 'hola') { sistema(d.nombre + ' entró a la sala'); return; }
  if (d.tipo === 'msg') {
    agregar({ nombre: d.nombre, texto: d.texto, hora: Date.now(), mio: false });
    tono();
    reenviar(d, deQuien);
  }
  if (d.tipo === 'audio') {
    const blob = new Blob([d.datos], { type: d.mime });
    agregar({ nombre: d.nombre, audioUrl: URL.createObjectURL(blob), hora: Date.now(), mio: false });
    tono();
    reenviar(d, deQuien);
  }
}

function enviar() {
  const campo = document.getElementById('texto');
  const texto = campo.value.trim();
  if (!texto) return;
  agregar({ nombre: miNombre, texto: texto, hora: Date.now(), mio: true });
  Object.values(conexiones).forEach(c => { if (c.open) c.send({ tipo: 'msg', nombre: miNombre, texto: texto }); });
  campo.value = '';
  cambiarBoton();
  campo.focus();
}

/* Botón de la derecha: micrófono si no hay texto, enviar si hay texto */
function cambiarBoton() {
  const hay = document.getElementById('texto').value.trim().length > 0;
  document.getElementById('botonAccion').textContent = hay ? '➤' : '🎤';
}

function accion() {
  const hayTexto = document.getElementById('texto').value.trim().length > 0;
  if (hayTexto) { enviar(); return; }
  if (grabando) detenerGrabacion(true); else iniciarGrabacion();
}

/* Notas de voz: toca el micrófono para empezar y vuelve a tocar para enviar */
async function iniciarGrabacion() {
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    sistema('No se pudo usar el micrófono. Revisa el permiso.');
    return;
  }
  trozos = [];
  grabador = new MediaRecorder(flujo);
  grabador.ondataavailable = ev => { if (ev.data.size > 0) trozos.push(ev.data); };
  grabador.onstop = async () => {
    flujo.getTracks().forEach(t => t.stop());
    if (!grabador.enviar) return;
    const blob = new Blob(trozos, { type: grabador.mimeType || 'audio/webm' });
    const datos = await blob.arrayBuffer();
    agregar({ nombre: miNombre, audioUrl: URL.createObjectURL(blob), hora: Date.now(), mio: true });
    Object.values(conexiones).forEach(c => {
      if (c.open) c.send({ tipo: 'audio', nombre: miNombre, mime: blob.type, datos: datos });
    });
  };
  grabador.enviar = false;
  grabador.start();
  grabando = true;
  tiempoGrab = 0;
  document.getElementById('texto').style.display = 'none';
  document.getElementById('grabandoBarra').style.display = 'flex';
  const b = document.getElementById('botonAccion');
  b.textContent = '➤'; b.classList.add('grabando');
  reloj = setInterval(() => {
    tiempoGrab++;
    const m = Math.floor(tiempoGrab / 60), s = String(tiempoGrab % 60).padStart(2, '0');
    document.getElementById('segundos').textContent = m + ':' + s;
    if (tiempoGrab >= MAX_SEG_AUDIO) detenerGrabacion(true);
  }, 1000);
}

function detenerGrabacion(enviarAudio) {
  if (!grabando) return;
  grabando = false;
  clearInterval(reloj);
  grabador.enviar = enviarAudio;
  grabador.stop();
  document.getElementById('texto').style.display = '';
  document.getElementById('grabandoBarra').style.display = 'none';
  const b = document.getElementById('botonAccion');
  b.classList.remove('grabando');
  cambiarBoton();
}

function agregar(m) { mensajes.push(m); dibujar(); }
function sistema(t) { mensajes.push({ sis: true, texto: t, hora: Date.now() }); dibujar(); }
function aviso(t) { mensajes.push({ aviso: true, texto: t, hora: Date.now() }); dibujar(); }

function dibujar() {
  const cont = document.getElementById('mensajes');
  const sigueAbajo = cont.scrollHeight - cont.scrollTop - cont.clientHeight < 80;
  cont.innerHTML = '';
  mensajes.forEach(m => {
    const div = document.createElement('div');
    if (m.aviso) { div.className = 'aviso'; div.textContent = m.texto; }
    else if (m.sis) { div.className = 'sis'; div.textContent = m.texto; }
    else {
      div.className = 'msg ' + (m.mio ? 'yo' : 'otro');
      const hora = new Date(m.hora).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (!m.mio) {
        const a = document.createElement('div');
        a.className = 'autor'; a.style.color = colorDe(m.nombre); a.textContent = m.nombre;
        div.appendChild(a);
      }
      if (m.audioUrl) {
        const au = document.createElement('audio');
        au.controls = true; au.src = m.audioUrl; au.preload = 'metadata';
        div.appendChild(au);
      } else {
        const t = document.createElement('span');
        t.className = 'texto'; t.textContent = m.texto;
        div.appendChild(t);
      }
      const pie = document.createElement('span');
      pie.className = 'pie';
      pie.innerHTML = hora + (m.mio ? ' <span class="check">✓✓</span>' : '');
      div.appendChild(pie);
    }
    cont.appendChild(div);
  });
  if (sigueAbajo) cont.scrollTop = cont.scrollHeight;
}

function mostrarChat() {
  document.getElementById('inicio').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
}

/* Borrado automático: cada segundo se descartan textos y audios viejos */
setInterval(() => {
  const ahora = Date.now();
  const viejos = mensajes.filter(m => !m.aviso && !m.sis && ahora - m.hora >= MS_BORRADO);
  if (viejos.length) {
    viejos.forEach(m => { if (m.audioUrl) URL.revokeObjectURL(m.audioUrl); });
    mensajes = mensajes.filter(m => m.aviso || m.sis || ahora - m.hora < MS_BORRADO);
    dibujar();
  }
  const cuenta = document.getElementById('cuenta');
  if (cuenta) cuenta.textContent = 'Mensajes temporales · ' + MINUTOS_BORRADO + ' min';
}, 1000);

window.addEventListener('beforeunload', () => { mensajes = []; });
</script>
</body>
</html>
